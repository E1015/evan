<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>音游 - 节奏测试</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; touch-action: none; overscroll-behavior: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #start-btn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 15px 30px; font-size: 20px; background: #4ade80; color: #111;
      border: none; border-radius: 8px; font-weight: bold; display: block;
      z-index: 999; touch-action: manipulation; /* 增加这一行 */
    }
  </style>
</head>
<body>
  <button id="start-btn">点击开始</button>
  <canvas id="game"></canvas>
  
  <script>
    // 捕获全局报错，显示在按钮上
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      const btn = document.getElementById('start-btn');
      if(btn) btn.textContent = "报错: " + msg;
      return false;
    };

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('start-btn');

    let audioCtx = null;
    let isPlaying = false;
    let startOffset = 0;
    const bpm = 120;
    const beatTime = 60 / bpm;
    const laneCount = 4;
    const fallSpeed = 600;

    let notes = [];
    for (let i = 1; i <= 40; i++) {
      notes.push({
        time: i * (beatTime / 2),
        lane: Math.floor(Math.random() * laneCount),
        hit: false
      });
    }

    function fitCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', fitCanvas);

    function getSongTime() {
      if (!audioCtx || !isPlaying) return 0;
      return audioCtx.currentTime - startOffset;
    }

    function playBeep(freq = 880) {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      } catch(e) { console.log(e); }
    }

    function gameLoop() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const judgeLineY = h - 100;
      const laneWidth = w / laneCount;

      ctx.clearRect(0, 0, w, h);

      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      for (let i = 1; i < laneCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * laneWidth, 0);
        ctx.lineTo(i * laneWidth, h);
        ctx.stroke();
      }

      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, judgeLineY);
      ctx.lineTo(w, judgeLineY);
      ctx.stroke();

      const songTime = getSongTime();
      
      for (const note of notes) {
        if (note.hit) continue;
        const timeDiff = note.time - songTime;
        const y = judgeLineY - (timeDiff * fallSpeed);

        if (y > -50 && y < h + 50) {
          const x = note.lane * laneWidth + 10;
          ctx.fillStyle = timeDiff < 0 ? '#666' : '#4ade80';
          ctx.fillRect(x, y - 20, laneWidth - 20, 40);
        }
      }
      requestAnimationFrame(gameLoop);
    }

    canvas.addEventListener('touchstart', async (e) => {
      e.preventDefault();
      if (!audioCtx || !isPlaying) return;

      const rect = canvas.getBoundingClientRect();
      const w = canvas.clientWidth;
      const laneWidth = w / laneCount;

      for (const touch of e.changedTouches) {
        const x = touch.clientX - rect.left;
        const lane = Math.floor(x / laneWidth);
        const songTime = getSongTime();

        let hitNote = null;
        let minDiff = 0.15;

        for (const note of notes) {
          if (note.hit || note.lane !== lane) continue;
          const diff = Math.abs(note.time - songTime);
          if (diff < minDiff) {
            minDiff = diff;
            hitNote = note;
          }
        }

        if (hitNote) {
          hitNote.hit = true;
          playBeep(1200);
        } else {
          playBeep(400);
        }
      }
    }, { passive: false });

    // 修改按钮触发逻辑，使用 pointerdown 兼容性更好
    startBtn.addEventListener('pointerdown', async (e) => {
      e.preventDefault();
      if (isPlaying) return;
      
      try {
        startBtn.textContent = "加载中...";
