<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>音游 - 纯画布版</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; touch-action: none; overscroll-behavior: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let audioCtx = null;
    let isPlaying = false;
    let startOffset = 0;
    const bpm = 120;
    const beatTime = 60 / bpm;
    const laneCount = 4;
    const fallSpeed = 600;
    let errorMsg = ""; // 用来在屏幕上显示错误

    let notes = [];
    for (let i = 1; i <= 40; i++) {
      notes.push({
        time: i * (beatTime / 2),
        lane: Math.floor(Math.random() * laneCount),
        hit: false
      });
    }

    function fitCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', fitCanvas);

    function getSongTime() {
      if (!audioCtx || !isPlaying) return 0;
      return audioCtx.currentTime - startOffset;
    }

    function playBeep(freq = 880) {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      } catch(e) { errorMsg = "发声失败: " + e.message; }
    }

    // 启动游戏的核心函数
    async function startGame() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        isPlaying = true;
        startOffset = audioCtx.currentTime + 0.2;
        
        for (let i = 0; i < 20; i++) {
          const beatStartTime = startOffset + i * beatTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.value = 440;
          gain.gain.setValueAtTime(0.05, beatStartTime);
          gain.gain.exponentialRampToValueAtTime(0.001, beatStartTime + 0.1);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(beatStartTime);
          osc.stop(beatStartTime + 0.1);
        }
        gameLoop();
      } catch (err) {
        errorMsg = "启动失败: " + err.message;
      }
    }

    function gameLoop() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);

      // 如果还没开始，画出开始提示
      if (!isPlaying) {
        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 30px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('轻触屏幕开始', w / 2, h / 2);
        
        if (errorMsg) {
          ctx.fillStyle = 'red';
          ctx.font = '16px sans-serif';
          ctx.fillText(errorMsg, w / 2, h / 2 + 50);
        }
        requestAnimationFrame(gameLoop);
        return;
      }

      // --- 游戏开始后的画面 ---
      const judgeLineY = h - 100;
      const laneWidth = w / laneCount;

      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      for (let i = 1; i < laneCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * laneWidth, 0);
        ctx.lineTo(i * laneWidth, h);
        ctx.stroke();
      }

      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, judgeLineY);
      ctx.lineTo(w, judgeLineY);
      ctx.stroke();

      const songTime = getSongTime();
      for (const note of notes) {
        if (note.hit) continue;
        const timeDiff = note.time - songTime;
        const y = judgeLineY - (timeDiff * fallSpeed);

        if (y > -50 && y < h + 50) {
          const x = note.lane * laneWidth + 10;
          ctx.fillStyle = timeDiff < 0 ? '#666' : '#4ade80';
          ctx.fillRect(x, y - 20, laneWidth - 20, 40);
        }
      }
      requestAnimationFrame(gameLoop);
    }

    // 所有的触摸都在画布上处理
    canvas.addEventListener('touchstart', async (e) => {
      e.preventDefault();
      
      if (!isPlaying) {
        startGame();
        return;
      }

      // 游戏中的判定
      const rect = canvas.getBoundingClientRect();
      const w = canvas.clientWidth;
      const laneWidth = w / laneCount;

      for (const touch of e.changedTouches) {
        const x = touch.clientX - rect.l
