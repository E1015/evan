<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>音游 - 状态监控版</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #111; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; background: #222; }
    /* 左上角的监控面板 */
    #debug {
      position: absolute; top: 10px; left: 10px;
      color: #0f0; font-size: 14px; font-family: monospace;
      pointer-events: none; z-index: 999; background: rgba(0,0,0,0.5); padding: 5px;
    }
  </style>
</head>
<body>
  <div id="debug">初始化中...</div>
  <canvas id="game"></canvas>
  
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const debugDiv = document.getElementById('debug');

    let audioCtx = null;
    let isPlaying = false;
    let startOffset = 0; 
    let errorLog = "无";

    const bpm = 120;
    const beatTime = 60 / bpm; 
    const laneCount = 4;
    const fallSpeed = 600; // 像素/秒
    const judgeLineYOffset = 100;
    const hitWindow = 0.15;

    let notes = [];
    for (let i = 1; i <= 40; i++) {
      notes.push({
        time: i * (beatTime / 2), 
        lane: Math.floor(Math.random() * laneCount),
        hit: false 
      });
    }

    function fitCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    setTimeout(fitCanvas, 100);

    function getSongTime() {
      if (!audioCtx || !isPlaying) return 0;
      return audioCtx.currentTime - startOffset;
    }

    function playBeep(freq) {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      } catch(e) { errorLog = e.message; }
    }

    async function startGame() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }
        isPlaying = true;
        startOffset = audioCtx.currentTime + 0.5;
        
        for (let i = 0; i < 20; i++) {
          const beatStartTime = startOffset + i * beatTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.value = 440;
          gain.gain.setValueAtTime(0.05, beatStartTime);
          gain.gain.exponentialRampToValueAtTime(0.001, beatStartTime + 0.1);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(beatStartTime);
          osc.stop(beatStartTime + 0.1);
        }
      } catch (err) {
        errorLog = "启动失败:" + err.message;
      }
    }

    function gameLoop() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);

      // --- 监控面板实时更新 ---
      if (isPlaying) {
        let aTime = audioCtx ? audioCtx.currentTime.toFixed(2) : "null";
        let sTime = getSongTime().toFixed(2);
        debugDiv.innerHTML = `状态: 游戏中<br>音频时间: ${aTime}<br>歌曲时间: ${sTime}<br>错误: ${errorLog}`;
      } else {
        debugDiv.innerHTML = `状态: 未开始<br>请点击屏幕<br>错误: ${errorLog}`;
      }

      if (!isPlaying) {
        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 30px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('请触摸屏幕开始', w / 2, h / 2);
        requestAnimationFrame(gameLoop);
        return;
      }

      const judgeLineY = h - judgeLineYOffset;
      const laneWidth = w / laneCount;

      // 画轨道
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 2;
      for (let i = 1; i < laneCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * laneWidth, 0);
        ctx.lineTo(i * laneWidth, h);
        ctx.stroke();
      }

      // 画判定线
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, judgeLineY);
      ctx.lineTo(w, judgeLineY);
      ctx.stroke();

      // 画方块
      const songTime = getSongTime();
      for (const note of notes) {
        if (note.hit) continue;
        
        const timeDiff = note.time - songTime;
        const y = judgeLineY - (timeDiff * fallSpeed);

        if (y > -50 && y < h + 50) {
          const x = note.lane * laneWidth + 10;
          ctx.fillStyle = timeDiff < 0 ? '#666' : '#4ade80';
          // 画得更大一点，防止看不见
