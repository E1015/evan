<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>保底测试</title>
  <style>
    /* 增加了这行，强制铺满屏幕，防止某些手机认不出百分比高度 */
    html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #111; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; background: #222; }
    /* 纯 HTML 提示文字，绝对能看见 */
    #hint {
      position: absolute; top: 20px; left: 0; width: 100%; 
      text-align: center; color: #fff; font-size: 20px; font-family: sans-serif;
      pointer-events: none; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="hint">请触摸屏幕</div>
  <canvas id="game"></canvas>
  
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const hint = document.getElementById('hint');

    // 1. 先验证画布能不能画东西
    function initCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // 在画布中间画一个红圈，只要能看到红圈，说明画布活了
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.beginPath();
      ctx.arc(w / 2, h / 2, 50, 0, Math.PI * 2);
      ctx.strokeStyle = 'red';
      ctx.lineWidth = 5;
      ctx.stroke();
    }
    
    // 延迟一点点执行，确保屏幕尺寸读取正确
    setTimeout(initCanvas, 100);

    // 2. 验证触摸和发声
    canvas.addEventListener('touchstart', async (e) => {
      e.preventDefault();
      hint.innerText = "触摸成功！正在发声...";

      try {
        // 创建音频上下文
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        // 播放一个长一点的“滴”声
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);

        setTimeout(() => { hint.innerText = "测试完成！"; }, 1000);

      } catch (err) {
        hint.innerText = "出错: " + err.message;
        hint.style.color = "red";
      }
    }, { passive: false });
  </script>
</body>
</html>
